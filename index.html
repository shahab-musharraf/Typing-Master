<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Typing Master</title>
</head>
<body>
    <div class="container">
        <input type="text" class="textInput">
        <div class="wrap">
            <div class="typingText">
                <p>Loading...</p>
            </div>
            <div class="contentBox">
                <ul>
                    <li class="timeLeft">
                        <p>Time Left: </p>
                        <span><b>60</b>s</span>
                    </li>
                    <li class="mistakes">
                        <p>Mistakes: </p>
                        <span>0</span>
                    </li>
                    <li class="wpm">
                        <p>WPM: </p>
                        <span>0</span>
                    </li>
                    <li class="cpm">
                        <p>CPM: </p>
                        <span>0</span>
                    </li>
                </ul>
                <button class="tryAgainBtn">Try Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
